<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Bagian Perekonomian, SDA dan Administrasi Pembangunan - Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="" name="keywords" />
    <meta content="" name="description" />

    <!-- Favicon -->
    <link href="assets/img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Libraries Stylesheet -->
    <link
      href="assets/lib/owlcarousel/assets/owl.carousel.min.css"
      rel="stylesheet"
    />
    <link
      href="assets/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css"
      rel="stylesheet"
    />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Template Stylesheet -->
    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
      /* Penguncian Layout 100vh Tanpa Scrollbar */
      html,
      body {
        height: 100vh;
        max-height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Menghilangkan scrollbar secara total */
      }

      /* Full Screen Background Utama */
      body {
        position: relative;
        background-image: url("assets/img/bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* Overlay Gelap Halus untuk Kedalaman Gambar Belakang */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 25, 47, 0.45);
        backdrop-filter: blur(1px);
        z-index: 0;
      }

      .login-wrapper {
        position: relative;
        z-index: 1;
        height: 100vh;
        max-height: 100vh;
      }

      /* Kartu Form Login Transparan (Glassmorphism) */
      .login-card {
        background: rgba(255, 255, 255, 0.75); /* Transparan lembut */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        padding: 2.5rem;
        width: 100%;
        max-width: 430px;
      }

      /* Styling Input Form agar Pas dengan Tema Transparan */
      .login-card .form-control {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(200, 200, 200, 0.6);
      }

      .login-card .form-control:focus {
        background: #ffffff;
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }

      /* Teks Identitas Instansi */
      .brand-side-content {
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>

  <body>
    <div
      class="container-fluid position-relative d-flex p-0 login-wrapper align-items-center justify-content-between px-lg-5"
    >
      <!-- Spinner Start -->
      <div
        id="spinner"
        class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
        style="z-index: 9999"
      >
        <div
          class="spinner-border text-primary"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </div>
      <!-- Spinner End -->

      <!-- Sisi Kiri: Identitas Instansi & Visi Daerah -->
      <div class="d-none d-lg-block col-lg-7 brand-side-content pe-4">
        <div class="d-flex align-items-center mb-4">
          <img
            src="assets/img/icon.png"
            alt="Logo"
            style="
              width: 75px;
              height: 85px;
              object-fit: contain;
              filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
            "
            class="me-3"
          />
          <div>
            <span
              class="text-warning text-uppercase fw-bold"
              style="letter-spacing: 2px; font-size: 0.9rem"
              >Pemerintah Kabupaten Pasuruan</span
            >
            <h3
              class="text-white fw-bold mb-0"
              style="font-size: 1.6rem; line-height: 1.3"
            >
              Bagian Perekonomian, SDA dan Administrasi Pembangunan
            </h3>
          </div>
        </div>
        <p
          class="lead text-light mb-4"
          style="font-size: 1.05rem; opacity: 0.95; max-width: 600px"
        >
          Sistem Informasi Pengawasan & Evaluasi Kinerja Instansi Daerah
          Terintegrasi
        </p>
        <div
          class="p-3 rounded bg-dark bg-opacity-30 border border-light border-opacity-25 d-inline-block"
        >
          <p class="mb-0 fst-italic text-warning" style="letter-spacing: 1px">
            "Pasuruan Maju, Sejahtera, dan Berkeadilan"
          </p>
        </div>
      </div>

      <!-- Sisi Kanan: Kartu Form Login Transparan -->
      <div
        class="col-12 col-lg-5 d-flex justify-content-center justify-content-lg-end py-2"
      >
        <div class="login-card">
          <form
            onsubmit="
              event.preventDefault();
              aksiLogin();
            "
          >
            <div class="text-center mb-4">
              <img
                src="assets/img/icon.png"
                alt="Logo"
                style="width: 45px; height: 55px"
                class="mb-2 d-lg-none"
              />
              <h4 class="text-primary fw-bold mb-1">Masuk Aplikasi</h4>
              <p class="text-muted small">Silakan masukkan akun resmi Anda</p>
            </div>

            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="inputEmail"
                placeholder="name@example.com"
              />
              <label for="inputEmail">Email address</label>
            </div>
            <div class="form-floating mb-4">
              <input
                type="password"
                class="form-control"
                id="inputPassword"
                placeholder="Password"
              />
              <label for="inputPassword">Password</label>
              <span
                onclick="togglePassword()"
                style="
                  position: absolute;
                  right: 15px;
                  top: 50%;
                  transform: translateY(-50%);
                  cursor: pointer;
                  color: #666;
                "
              >
                <i class="fa fa-solid fa-eye" id="iconPassword"></i>
              </span>
            </div>

            <button
              type="submit"
              class="btn btn-primary py-3 w-100 mb-2 fw-bold shadow-sm"
            >
              Sign In
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Template Javascript -->
    <script src="assets/js/apps.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
