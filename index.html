<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Bagian Perekonomian, SDA dan Administrasi Pembangunan - Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="" name="keywords" />
    <meta content="" name="description" />

    <!-- Favicon -->
    <link href="assets/img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Libraries Stylesheet -->
    <link
      href="assets/lib/owlcarousel/assets/owl.carousel.min.css"
      rel="stylesheet"
    />
    <link
      href="assets/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css"
      rel="stylesheet"
    />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Template Stylesheet -->
    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
      /* Kolom Kiri Utama */
      .bg-login-kiri {
        position: relative;
        background-image: url("assets/img/icon.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      /* Lapisan Blur Paling Belakang (Dikurangi menjadi 3px agar tidak terlalu kabur) */
      .bg-login-kiri::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: url("assets/img/bg.jpg");
        background-size: cover;
        background-position: center;
        filter: blur(3px) brightness(0.9); /* Nilai blur diturunkan dari 10px ke 3px */
        transform: scale(1.05);
      }

      /* Lapisan Gambar Utama di Depan */
      .gambar-depan-wrapper {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 2rem;
      }

      .gambar-depan-wrapper img {
        max-width: 85%;
        max-height: 85%;
        object-fit: contain;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>

  <body>
    <div class="container-xxl position-relative bg-white d-flex p-0">
      <!-- Spinner Start -->
      <div
        id="spinner"
        class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
      >
        <div
          class="spinner-border text-primary"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </div>
      <!-- Spinner End -->

      <!-- Sign In Start -->
      <div class="container-fluid px-0">
        <div class="row g-0 vh-100 align-items-center">
          <!-- Kolom Kiri: Background Gambar dari assets/img/icon.jpg -->
          <div class="col-lg-7 d-none d-lg-block h-100 bg-login-kiri">
            <div class="gambar-depan-wrapper">
              <img src="assets/img/icon.png" alt="Latar Belakang SIAPSATYA" />
            </div>
          </div>

          <!-- Kolom Kanan: Form Login -->
          <div
            class="col-12 col-lg-5 d-flex align-items-center justify-content-center h-100 bg-white"
          >
            <div class="p-4 p-sm-5 w-100" style="max-width: 450px">
              <form
                onsubmit="
                  event.preventDefault();
                  aksiLogin();
                "
              >
                <div
                  class="d-flex align-items-center justify-content-center mb-2"
                >
                  <img
                    src="assets/img/icon.png"
                    alt="Logo"
                    style="width: 45px; height: 55px"
                  />
                </div>
                <p
                  class="h6 d-flex align-items-center justify-content-center text-center mb-4 text-dark"
                >
                  Bagian Perekonomian, SDA dan Administrasi Pembangunan
                </p>
                <p
                  class="h5 d-flex align-items-center justify-content-center text-center mb-4 fw-bold text-primary"
                >
                  Masuk Aplikasi
                </p>
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="inputEmail"
                    placeholder="name@example.com"
                  />
                  <label for="floatingInput">Email address</label>
                </div>
                <div class="form-floating mb-4">
                  <input
                    type="password"
                    class="form-control"
                    id="inputPassword"
                    placeholder="Password"
                  />
                  <label for="floatingPassword">Password</label>
                  <span
                    onclick="togglePassword()"
                    style="
                      position: absolute;
                      right: 15px;
                      top: 50%;
                      transform: translateY(-50%);
                      cursor: pointer;
                      color: #666;
                    "
                  >
                    <i class="fa fa-solid fa-eye" id="iconPassword"></i>
                  </span>
                </div>

                <button type="submit" class="btn btn-primary py-3 w-100 mb-4">
                  Sign In
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!-- Sign In End -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/lib/chart/chart.min.js"></script>
    <script src="assets/lib/easing/easing.min.js"></script>
    <script src="assets/lib/waypoints/waypoints.min.js"></script>
    <script src="assets/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="assets/lib/tempusdominus/js/moment.min.js"></script>
    <script src="assets/lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="assets/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css"></script>

    <!-- SDK Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Template Javascript -->
    <script src="assets/js/apps.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/rumus_rsud.js"></script>
  </body>
</html>
